version: 1
product:
  id: station
  name: Station
  version: 0.4.1
  description: Portable Discord + Hermes + AGK-TUI + Portal platform.
components:
  agk_tui:
    role: RMUX session mapping and terminal control surface
    repository: agentik-os/AGK-TUI
    commit: c757ef894aa04355bd7f350bc1d45af4c5c32d9a
  hermes:
    role: agent runtime, profiles, tools, memory, gateways and providers
    repository: NousResearch/hermes-agent
    commit: f896b386d06a11c47784a5a5676c1be31945048e
  station:
    role: installation, fleet portal, Discord lifecycle, OS packages, policy, doctor, backup and rollback
boundaries:
  - AGK-TUI owns RMUX mapping and terminal session UX only.
  - Hermes remains an upstream runtime with profile-local state.
  - Station owns the complete portable product and overlays.
  - Discord application creation and OAuth authorization remain owner-controlled.
profiles: [operator, agentik, mission, private]
