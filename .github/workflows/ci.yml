name: Station CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/apps/hermes-fleet/package-lock.json
      - run: uv run --no-project --with pytest==9.0.2 --with PyYAML==6.0.3 pytest -q
      - run: bash -n install bootstrap-vps.sh bin/station scripts/*.sh overlay/install.sh overlay/bootstrap-vps.sh overlay/scripts/*.sh
      - run: python3 -m py_compile scripts/*.py overlay/scripts/*.py
      - run: npm ci
        working-directory: overlay/apps/hermes-fleet
      - run: npm test
        working-directory: overlay/apps/hermes-fleet
      - run: npm run typecheck
        working-directory: overlay/apps/hermes-fleet
      - run: npm run build
        working-directory: overlay/apps/hermes-fleet
